services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-labinventory}
      POSTGRES_USER: ${POSTGRES_USER:-labinventory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labinventory_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
    env_file:
      - path: .env
        required: false
    environment:
      APP_NAME: ${APP_NAME:-LabInventory}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      API_VERSION: ${API_VERSION:-v1}
      PROTOCOL_VERSION: ${PROTOCOL_VERSION:-1}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      POSTGRES_DB: ${POSTGRES_DB:-labinventory}
      POSTGRES_USER: ${POSTGRES_USER:-labinventory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labinventory_dev_password}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-labinventory}:${POSTGRES_PASSWORD:-labinventory_dev_password}@db:5432/${POSTGRES_DB:-labinventory}
      UPLOAD_ROOT: /data/uploads
      INSTANCE_DATA_ROOT: /data/instance
      RUN_DB_TESTS: ${RUN_DB_TESTS:-1}
      MDNS_ENABLED: ${MDNS_ENABLED:-false}
      MDNS_SERVICE_NAME: ${MDNS_SERVICE_NAME:-LabInventory Backend}
      MDNS_SERVICE_TYPE: ${MDNS_SERVICE_TYPE:-_labinventory._tcp.}
      MDNS_ADVERTISE_IP: ${MDNS_ADVERTISE_IP:-}
      MDNS_FAIL_FAST: ${MDNS_FAIL_FAST:-false}
    ports:
      - "0.0.0.0:${API_PORT:-8000}:8000"
    volumes:
      - instance-data:/data/instance
      - upload-data:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
  instance-data:
  upload-data:
